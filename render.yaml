# Render Blueprint - Frontend Static Site only (backend is already deployed)
services:
  - type: web
    name: wow3d-cad-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://wow3d-cad-agent.onrender.com
